version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
  - name: dim_customer_current
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
      - name: has_history
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
