name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            setup.py
            dev-requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest flake8
      - name: Lint
        run: python -m flake8 dbt test
      - name: Unit tests
        run: python -m pytest test/unit

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: setup.py
      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

  ci-success:
    name: CI Success
    # Stable aggregate gate. This is the only job that branch protection needs to
    # require, so the matrix above can change without updating the protection rule.
    # `always()` is required: without it a failed dependency would skip this job,
    # and branch protection treats a skipped check as passing.
    if: always()
    needs:
      - lint-and-unit
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')
          if [ -n "$failed" ]; then
            echo "::error::upstream jobs did not succeed: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "All upstream jobs succeeded."
