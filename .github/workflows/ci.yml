name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            setup.py
            dev-requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest flake8
      - name: Lint
        run: python -m flake8 dbt scripts test
      - name: Unit tests
        run: python -m pytest test/unit

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: setup.py
      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path
          import tarfile

          sdist = next(Path("dist").glob("*.tar.gz"))
          required_suffixes = {
              "scripts/run_doris_functional_tests.py",
              "test/doris_test.env",
          }
          with tarfile.open(sdist) as archive:
              members = {member.name for member in archive.getmembers()}
          missing = {
              suffix
              for suffix in required_suffixes
              if not any(name.endswith("/" + suffix) for name in members)
          }
          if missing:
              raise SystemExit(
                  "source distribution is missing: " + ", ".join(sorted(missing))
              )
          PY

  examples-static:
    name: Examples static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check shell syntax
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files 'examples/**/*.sh')
      - name: Test the examples runners
        run: |
          examples/doris-demos/scripts/test-run-all.sh
          examples/doris-demos/scripts/test-start-doris.sh
      - name: Check Notebook integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebooks = sorted(
              Path("examples/doris-demos/notebooks").glob("*.ipynb")
          )
          if len(notebooks) != 5:
              raise SystemExit(f"expected 5 notebooks, found {len(notebooks)}")

          errors = []
          for notebook in notebooks:
              try:
                  document = json.loads(notebook.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as error:
                  errors.append(f"{notebook}: invalid JSON: {error}")
                  continue

              cells = document.get("cells")
              if not isinstance(cells, list):
                  errors.append(f"{notebook}: cells must be a list")
                  continue

              cell_ids = [cell.get("id") for cell in cells]
              missing_ids = [
                  index
                  for index, cell_id in enumerate(cell_ids)
                  if not isinstance(cell_id, str) or not cell_id
              ]
              if missing_ids:
                  errors.append(
                      f"{notebook}: cells without IDs at indexes {missing_ids}"
                  )
              present_ids = [cell_id for cell_id in cell_ids if cell_id]
              if len(present_ids) != len(set(present_ids)):
                  errors.append(f"{notebook}: cell IDs are not unique")

              for index, cell in enumerate(cells):
                  if cell.get("cell_type") != "code":
                      continue
                  if cell.get("outputs"):
                      errors.append(f"{notebook}: cell {index} has outputs")
                  if cell.get("execution_count") is not None:
                      errors.append(
                          f"{notebook}: cell {index} has an execution count"
                      )

          if errors:
              raise SystemExit("\n".join(errors))
          print(f"Validated {len(notebooks)} notebooks.")
          PY
      - name: Check Notebook helper syntax
        run: python -m py_compile examples/doris-demos/scripts/notebook_helpers.py
      - name: Check demo language
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          chinese = re.compile(r"[\u4e00-\u9fff]")
          files = subprocess.check_output(
              ["git", "ls-files", "examples"], text=True
          ).splitlines()
          matches = []
          for name in files:
              path = Path(name)
              if chinese.search(path.read_text(encoding="utf-8")):
                  matches.append(name)
          if matches:
              raise SystemExit(
                  "Chinese user-facing text found in demo files:\n"
                  + "\n".join(matches)
              )
          print(f"Checked {len(files)} tracked example files.")
          PY

  ci-success:
    name: CI Success
    # Stable aggregate gate. This is the only job that branch protection needs to
    # require, so the matrix above can change without updating the protection rule.
    # `always()` is required: without it a failed dependency would skip this job,
    # and branch protection treats a skipped check as passing.
    if: always()
    needs:
      - lint-and-unit
      - package
      - examples-static
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')
          if [ -n "$failed" ]; then
            echo "::error::upstream jobs did not succeed: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "All upstream jobs succeeded."
